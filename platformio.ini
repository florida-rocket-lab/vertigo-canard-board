; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = /home/zach/Documents/x86-64/Laptop/FRL/vertigo-canard-board/Src

[env:STM32H750VBx]
platform = ststm32
board = genericSTM32H750VB
platform_packages = toolchain-gccarmnoneeabi@1.140201.0
board_build.ldscript = Src/cubemx_autogen/ldscripts/STM32H750VBTX_FLASH.ld
board_build.stm32cube.startup_file = Src/cubemx_autogen/Startup/startup_stm32h750vbtx.s
upload_protocol = stlink
debug_tool = stlink
build_flags = 
	-ISrc/cubemx_autogen/Drivers/CMSIS/Include
	-ISrc/cubemx_autogen/Drivers/CMSIS/Device/ST/STM32H7xx/Include
	-ISrc/cubemx_autogen/Drivers/STM32H7xx_HAL_Driver/Inc
	-ISrc/cubemx_autogen/Inc
debug_build_flags = 
	-g
	-DDEBUG
extra_scripts = pre:scripts/format_cubemx.py

